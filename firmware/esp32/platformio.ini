; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = left

[env:c3]
board = seeed_xiao_esp32c3
upload_port = COM10
monitor_port = COM10

[env:proto]
build_flags = !python gitVersion.py -std=gnu++17  -DCORE_DEBUG_LEVEL=3
upload_port = COM14
monitor_port = COM14

[env:right]
build_flags = !python gitVersion.py -std=gnu++17  -DCORE_DEBUG_LEVEL=3
upload_port = COM15
monitor_port = COM15


[env:left_pressure]
build_flags = !python gitVersion.py -std=gnu++17  -DLEFT_HAND  -DCORE_DEBUG_LEVEL=3 -DSENSOR -DWITH_OLED_DISPLAY
upload_port = COM11
monitor_port = COM11

[env:left]
build_flags = !python gitVersion.py -std=gnu++17  -DLEFT_HAND -DCORE_DEBUG_LEVEL=3
upload_port = COM11
monitor_port = COM11

[env:left_display]
build_flags = !python gitVersion.py -std=gnu++17  -DLEFT_HAND -DCORE_DEBUG_LEVEL=3 -DWITH_OLED_DISPLAY
upload_port = COM11
monitor_port = COM11

[env:demo_right]
build_flags = !python gitVersion.py -std=gnu++17  -DDEMO -DCORE_DEBUG_LEVEL=3
upload_port = COM15
monitor_port = COM15

[env:demo_left]
build_flags = !python gitVersion.py -std=gnu++17  -DLEFT_HAND -DDEMO -DCORE_DEBUG_LEVEL=3
upload_port = COM11
monitor_port = COM11

[env]
platform = espressif32@6
board = seeed_xiao_esp32s3
board_build.partitions = default_8MB.csv
build_unflags = -std=gnu++11
framework = arduino
upload_protocol = esptool
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = 
	roboticsbrno/ServoESP32@^1.1.1
	bblanchon/ArduinoJson@^7.4.2
	https://github.com/reivaxy/XOLEDDisplay/archive/refs/tags/v1.0.tar.gz
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.3.0

